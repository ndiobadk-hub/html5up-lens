name: CI/CD Pipeline - Build, Push & Deploy

on:
  push:
    branches: [ main ]

env:
  IMAGE_NAME: html5up-lens
  IMAGE_TAG: latest
  DOCKER_REGISTRY: docker.io

jobs:
  build-and-push:
    name: CI - Build & Push
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du code source
        uses: actions/checkout@v4

      - name: Connexion à Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build de l'image Docker
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} .

      - name: Push de l'image vers Docker Hub
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

  deploy:
    name: CD - Deploy
    needs: build-and-push         
    runs-on: [self-hosted, runner-isi]   

    steps:
      - name: Pull de la dernière image depuis Docker Hub
        run: docker pull ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      - name: Stopper le conteneur existant (si présent)
        run: docker stop ${{ env.IMAGE_NAME }} || true

      - name: Supprimer l'ancien conteneur
        run: docker rm ${{ env.IMAGE_NAME }} || true

      - name: Lancer le nouveau conteneur sur le port 80
        run: docker run -d \
            --name ${{ env.IMAGE_NAME }} \
            -p 80:80 \
            --restart unless-stopped \
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
